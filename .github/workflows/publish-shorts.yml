name: Publish Short (render → vertical → YouTube)

on:
  schedule:
    # Mon/Wed/Sat 15:00 UTC (11:00 ET) — staggered away from long-form Tue/Fri 23:30
    - cron: '0 15 * * 1,3,6'
  workflow_dispatch:
    inputs:
      topic:
        description: "Topic (blank = promo short for the latest long video)"
        required: false
        default: ""
      test:
        description: "true = render + download + vertical repack ONLY, no upload"
        required: false
        default: "false"

concurrency:
  group: publish-shorts
  cancel-in-progress: false

jobs:
  short:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 📥 Checkout (push-capable — ledger gets committed)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SECRET_WRITER_PAT || github.token }}

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install googleapis + sharp + fonts (thumbnail generator)
        run: |
          npm install googleapis sharp --no-save
          mkdir -p ~/.fonts && cp assets/fonts/*.ttf ~/.fonts/ && fc-cache -f >/dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: 🎬 Render + repack + upload
        env:
          GH_TOKEN: ${{ secrets.SECRET_WRITER_PAT }}
          INPUT_TOPIC: ${{ inputs.topic }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          TECH_YT_REFRESH_TOKEN: ${{ secrets.TECH_YT_REFRESH_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          ARGS=""
          if [ "${{ inputs.test }}" = "true" ]; then ARGS="$ARGS --test"; fi
          node publish-short.mjs $ARGS

      - name: 💾 Commit ledger
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts@howdevworks"
          git add state/shorts-published.json || true
          git diff --cached --quiet || git commit -m "shorts state [skip ci]"
          git pull --rebase || true
          if ! git push; then
            [ -n "$NTFY_TOPIC" ] && curl -s -H "Title: How Dev Works - SHORTS STATE PUSH FAILED" -d "shorts ledger not saved" "https://ntfy.sh/$NTFY_TOPIC" || true
            exit 1
          fi

      - name: 📢 Alert on failure
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          [ -n "$NTFY_TOPIC" ] && curl -s -H "Title: How Dev Works - SHORTS FAILED" -d "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" "https://ntfy.sh/$NTFY_TOPIC" || true
