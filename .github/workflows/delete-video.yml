name: Delete video (careful)

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: "YouTube video id to delete permanently (e.g. -vnkAF_T3Ww)"
        required: true
        default: ""
      confirm:
        description: "Type DELETE to confirm"
        required: true
        default: ""

jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install googleapis
        run: npm install googleapis --no-save

      - name: Delete video
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          TECH_YT_REFRESH_TOKEN: ${{ secrets.TECH_YT_REFRESH_TOKEN }}
          INPUT_VIDEO_ID: ${{ inputs.video_id }}
          CONFIRM: ${{ inputs.confirm }}
        run: node tools/delete-video.mjs
