name: Topic Bank (daily)

on:
  schedule:
    # 00:45 UTC = 05:45 PKT — before the Tue/Fri publish slots pick from the bank
    - cron: '45 0 * * *'
  workflow_dispatch:

concurrency:
  group: topic-bank
  cancel-in-progress: false

jobs:
  bank:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout (push-capable)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SECRET_WRITER_PAT || github.token }}

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🧠 Score daily.dev trends → topic bank
        env:
          DAILY_DEV_TOKEN: ${{ secrets.DAILY_DEV_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node tech-topic-brain.mjs

      - name: 💾 Commit topic bank
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          git config user.name "topic-brain"
          git config user.email "brain@howdevworks"
          git add state/tech-topic-bank.json || true
          git diff --cached --quiet || git commit -m "topic bank update [skip ci]"
          git pull --rebase || true
          if ! git push; then
            [ -n "$NTFY_TOPIC" ] && curl -s -H "Title: How Dev Works - BANK PUSH FAILED" -d "topic bank update not saved" "https://ntfy.sh/$NTFY_TOPIC" || true
            exit 1
          fi

      - name: 📢 Alert on failure
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          [ -n "$NTFY_TOPIC" ] && curl -s -H "Title: How Dev Works - TOPIC BANK FAILED" -d "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" "https://ntfy.sh/$NTFY_TOPIC" || true
