name: Publish (render → YouTube)

on:
  schedule:
    # Tue + Fri 23:30 UTC = 19:30 ET — video lands scheduled for the NEXT slot
    - cron: '30 23 * * 2,5'
  workflow_dispatch:
    inputs:
      topic:
        description: "Topic (blank = auto-pick top idea from topic bank)"
        required: false
        default: ""
      minutes:
        description: "target minutes"
        required: false
        default: "10"
      fallback:
        description: "true = curated deep-dive script (guaranteed length)"
        required: false
        default: "true"
      test:
        description: "true = render + download ONLY, no upload (safe chain test)"
        required: false
        default: "false"
      skip_waiting:
        description: "true = ignore waiting renders, force a fresh render (chain tests)"
        required: false
        default: "false"
      name_waiting:
        description: "true = topic names the newest waiting render instead of rendering fresh"
        required: false
        default: "false"

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: 📥 Checkout (push-capable — state files get committed)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SECRET_WRITER_PAT || github.token }}

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install googleapis + ffmpeg (ffprobe for duration guard)
        run: |
          npm install googleapis --no-save
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: 🎬 Render + upload
        env:
          GH_TOKEN: ${{ secrets.SECRET_WRITER_PAT }}   # cross-repo dispatch + artifact download
          INPUT_TOPIC: ${{ inputs.topic }}             # env, not shell args: topics keep spaces safely
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          TECH_YT_REFRESH_TOKEN: ${{ secrets.TECH_YT_REFRESH_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          ARGS="--minutes ${{ inputs.minutes }} --fallback ${{ inputs.fallback }}"
          if [ "${{ inputs.test }}" = "true" ]; then ARGS="$ARGS --test"; fi
          if [ "${{ inputs.skip_waiting }}" = "true" ]; then ARGS="$ARGS --skip-waiting"; fi
          if [ "${{ inputs.name_waiting }}" = "true" ]; then ARGS="$ARGS --name-waiting"; fi
          node publish.mjs $ARGS

      - name: 💾 Commit state
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          git config user.name "publish-bot"
          git config user.email "bot@howdevworks"
          git add state/ || true
          git diff --cached --quiet || git commit -m "publish state [skip ci]"
          git pull --rebase || true
          if ! git push; then
            [ -n "$NTFY_TOPIC" ] && curl -s -H "Title: How Dev Works - STATE PUSH FAILED" -d "publish ledger not saved — next run may re-upload a video" "https://ntfy.sh/$NTFY_TOPIC" || true
            exit 1
          fi

      - name: 📢 Alert on failure
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          [ -n "$NTFY_TOPIC" ] && curl -s -H "Title: How Dev Works - PUBLISH FAILED" -d "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" "https://ntfy.sh/$NTFY_TOPIC" || true
