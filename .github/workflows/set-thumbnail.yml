name: Set thumbnail

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: "YouTube video id (e.g. 7_FBiOslvUE)"
        required: true
        default: ""
      thumb_path:
        description: "PNG path in this repo (generate new: see step log)"
        required: false
        default: "branding/thumbnail-git.png"
      title:
        description: "If set: generate a fresh thumbnail from this title instead of thumb_path"
        required: false
        default: ""

jobs:
  set:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install googleapis
        run: npm install googleapis --no-save

      - name: Generate thumbnail if a title was given
        if: ${{ inputs.title != '' }}
        run: node tools/make-thumbnail.mjs --title "${{ inputs.title }}" --out branding/thumb-generated.png

      - name: Attach thumbnail
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          TECH_YT_REFRESH_TOKEN: ${{ secrets.TECH_YT_REFRESH_TOKEN }}
          INPUT_VIDEO_ID: ${{ inputs.video_id }}
          THUMB_FILE: ${{ inputs.title != '' && 'branding/thumb-generated.png' || inputs.thumb_path }}
        run: node tools/set-thumbnail.mjs
